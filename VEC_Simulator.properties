# Vehicular Edge Computing Simulator - Configuration
#
# This file documents all customizable parameters.
# To modify simulation behavior, edit the corresponding Java files.

##############################################################################
# INFRASTRUCTURE CONFIGURATION
##############################################################################

# Cloud Server
cloud.mips = 50000
cloud.ram_mb = 32768
cloud.propagation_delay_ms = 80

# RSU Servers
rsu.count = 5
rsu.mips.base = 3000
rsu.mips.increment = 500
rsu.ram_mb.base = 4096
rsu.ram_mb.increment = 512
rsu.propagation_delay_ms = 10

# Vehicles (OBU)
vehicle.count = 20
vehicle.mips.min = 500
vehicle.mips.max = 2000
vehicle.ram_mb.min = 512
vehicle.ram_mb.max = 2560
vehicle.propagation_delay_ms = 1

##############################################################################
# SIMULATION PARAMETERS
##############################################################################

# Duration (seconds)
simulation.duration_sec = 60
assignment.grace_period_sec = 5
release.grace_period_sec = 10

# Task generation
task.inter_arrival_min_ms = 1000
task.inter_arrival_max_ms = 3000

##############################################################################
# TASK GENERATION PARAMETERS
##############################################################################

# Signal Strength (dBm)
task.signal_strength.min = -90
task.signal_strength.max = -30

# Critical Task Probability
task.critical_probability = 0.20

# Bandwidth (Mbps)
task.bandwidth.min = 5.0
task.bandwidth.max = 50.0

# Number of Instructions (MI)
task.instructions.min = 1000
task.instructions.max = 10000

# Task Size (MB)
task.size_mb.min = 1.0
task.size_mb.max = 50.0

##############################################################################
# ML OFFLOADING PREDICTOR
##############################################################################

# ML Service Endpoint
ml.predict.url = http://127.0.0.1:8000/predict
ml.predict.timeout_ms = 5000

# Rule-based Fallback Rules
ml.fallback.critical_high_mobility.target = cloud
ml.fallback.good_signal_low_mobility.target = rsu
ml.fallback.high_mi_good_bandwidth.target = rsu
ml.fallback.default.target = vehicle

# Thresholds for fallback rules
ml.fallback.signal_threshold_dbm = -60
ml.fallback.instructions_threshold_mi = 5000
ml.fallback.bandwidth_threshold_mbps = 15.0

##############################################################################
# TOPSIS SCHEDULER CONFIGURATION
##############################################################################

# Criteria Weights (must sum to 1.0)
scheduler.topsis.weight.mips = 0.30
scheduler.topsis.weight.health = 0.25
scheduler.topsis.weight.delay = 0.25
scheduler.topsis.weight.exec_time = 0.20

# Health Score Calculation
# H(n) = 1 - (? * U_cpu + ? * U_ram)
scheduler.health.alpha_cpu = 0.6
scheduler.health.beta_ram = 0.4

# Resource Allocation Strategy
scheduler.min_mips_allocation = 100
scheduler.ram_allocation_factor = 1.0  # ceil(taskSizeMB) * factor

##############################################################################
# FALLBACK SCHEDULING CHAINS
##############################################################################

# If RSU target saturated, try:
scheduler.fallback.rsu = [cloud, vehicle]

# If Cloud target saturated, try:
scheduler.fallback.cloud = [rsu, vehicle]

# If Vehicle target saturated, try:
scheduler.fallback.vehicle = [rsu, cloud]

##############################################################################
# MONITORING & STATISTICS
##############################################################################

# Statistics collection intervals (ms)
stats.collection_interval_ms = 1000

# Enable detailed logging
logging.enabled = true
logging.level = INFO  # DEBUG, INFO, WARN, ERROR

# Output file
stats.output_file = ./VEC_Simulation_Stats.csv

##############################################################################
# PERFORMANCE TARGETS (for reference)
##############################################################################

# Expected Completion Rate
perf.target_completion_rate = 0.90

# Expected Average Latency (ms)
perf.target_avg_latency_ms = 1500

# Expected Cloud Utilization %
perf.target_cloud_util = 0.75

# Expected RSU Utilization %
perf.target_rsu_util = 0.80

# Expected Vehicle Utilization %
perf.target_vehicle_util = 0.50

##############################################################################
# ADVANCED OPTIONS
##############################################################################

# Thread pool size for concurrent operations
threading.task_creation_threads = 1
threading.task_assignment_threads = 1
threading.task_release_threads = 1

# Queue configuration
queue.max_size = 10000
queue.blocking_timeout_sec = 2

# Random seed for reproducibility
simulation.random_seed = 42

# Enable energy consumption tracking (future)
energy.tracking_enabled = false

# Enable network simulation (future)
network.simulation_enabled = false

